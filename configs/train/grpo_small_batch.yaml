# GRPO training configuration with smaller batch size for larger models (14B+)

use_vllm: true
vllm_mode: colocate
vllm_enable_sleep_mode: true
vllm_tensor_parallel_size: 1
output_dir: GRPO
learning_rate: 5e-5
max_prompt_length: 512
optim: adamw_torch
num_train_epochs: 2
fp16: true
bf16: false
save_steps: 200
logging_steps: 1
max_completion_length: 1536

num_generations: 2
generation_batch_size: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
seed: 50
data_seed: ${train.seed}
